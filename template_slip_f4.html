<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 215mm 330mm; margin: 8mm 10mm; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 10px; margin: 0; }
        .slip-container {
            height: 60mm; width: 195mm; border: 1px dashed #777;
            padding: 2mm; box-sizing: border-box; page-break-inside: avoid;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2mm;
        }
        .header { grid-column: span 3; font-weight: bold; text-align: center; border-bottom: 1px solid #000; }
        .info { grid-column: span 3; display: flex; justify-content: space-between; }
        .col { border: 1px solid #ccc; padding: 1mm; }
        .row { display: flex; justify-content: space-between; }
        .footer { grid-column: span 3; font-weight: bold; border-top: 1px solid #000; display: flex; justify-content: space-between; }
        .numeric { text-align: right; font-family: 'Courier New', monospace; }
        .page-break { page-break-after: always; }
    </style>
</head>
<body>
    <div id="slip-root"></div>
    <script>
        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID').format(num);
        }
        function renderSlips(dataList, period) {
            const root = document.getElementById('slip-root');
            dataList.forEach((data, index) => {
                if (index > 0 && index % 5 === 0) root.innerHTML += '<div class="page-break"></div>';
                
                let internalHtml = data.rincian_potongan_internal.map(i => `
                    <div class="row"><span>${i.pos_nama} ${i.cicilan_info ? '('+i.cicilan_info+')' : ''}</span><span class="numeric">${formatRupiah(i.nominal)}</span></div>
                `).join('');

                root.innerHTML += `
                    <div class="slip-container">
                        <div class="header">SLIP GAJI ASN - ${data.opd.toUpperCase()} - ${period.toUpperCase()}</div>
                        <div class="info">
                            <span>NIP: ${data.nip}</span><span>NAMA: ${data.nama}</span><span>REK: ${data.norek || '-'}</span>
                        </div>
                        <div class="col">
                            <strong>Penghasilan</strong>
                            <div class="row"><span>Gaji Pokok</span><span class="numeric">${formatRupiah(data.rincian_penghasilan.gapok || 0)}</span></div>
                            <div class="row"><span>Total Penghasilan</span><span class="numeric">${formatRupiah(data.penghasilan_kotor)}</span></div>
                        </div>
                        <div class="col">
                            <strong>Potongan Resmi</strong>
                            <div class="row"><span>IWP Pegawai</span><span class="numeric">${formatRupiah(data.rincian_potongan_simgaji.iwp_beban_pegawai || 0)}</span></div>
                            <div class="row"><span>Total Resmi</span><span class="numeric">${formatRupiah(data.potongan_simgaji)}</span></div>
                        </div>
                        <div class="col">
                            <strong>Potongan Internal</strong>
                            ${internalHtml}
                            <div class="row"><span>Total Internal</span><span class="numeric">${formatRupiah(data.potongan_internal)}</span></div>
                        </div>
                        <div class="footer">
                            <span>TOTAL POTONGAN: ${formatRupiah(data.total_potongan)}</span>
                            <span>DITERIMA BERSIH (THP): ${formatRupiah(data.take_home_pay)}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
