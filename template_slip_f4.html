<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <style>
        @page { size: 215mm 330mm; margin: 8mm 10mm; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 10px; margin: 0; }
        .slip-container {
            height: 154mm; width: 195mm; border: 1px dashed #777;
            padding: 3mm; box-sizing: border-box; page-break-inside: avoid;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .header { border-bottom: 1px solid #000; padding-bottom: 1.5mm; margin-bottom: 1.5mm; }
        .opd-title { font-weight: bold; font-size: 11px; text-transform: uppercase; margin-bottom: 1.5mm; }
        .meta-list { display: grid; grid-template-columns: 80px 10px 1fr; row-gap: 1.5px; font-size: 9.5px; }
        .slip-grid { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 2.5mm; flex: 1; margin-bottom: 1.5mm; }
        .col { border: 1px solid #ccc; padding: 1.5mm; display: flex; flex-direction: column; justify-content: flex-start; }
        .col-title { font-weight: bold; font-size: 9.5px; border-bottom: 1px solid #aaa; padding-bottom: 1mm; margin-bottom: 1mm; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; font-size: 9px; line-height: 1.35; }
        .row.total { font-weight: bold; border-top: 1px dashed #aaa; margin-top: 2px; padding-top: 1.5px; }
        .footer { font-weight: bold; border-top: 1px solid #000; display: flex; justify-content: flex-end; padding: 1.5mm 0; font-size: 10px; }
        .numeric { text-align: right; font-family: 'Courier New', monospace; font-weight: 600; }
        .sign-block { display: flex; justify-content: flex-end; margin-top: 1.5mm; }
        .sign-box { text-align: center; width: 65mm; font-size: 9.5px; }
        .sign-space { height: 12mm; }
        .sign-name { font-weight: bold; }
        .sign-nip { font-size: 8.5px; }
        .page-break { page-break-after: always; }
    </style>
</head>
<body>
    <div id="slip-root"></div>
    <script>
        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID').format(num);
        }
        function renderSlips(dataList, period, signerInfo) {
            const root = document.getElementById('slip-root');
            const signTitle = (signerInfo && signerInfo.jabatan ? signerInfo.jabatan : 'Bendahara Pengeluaran') + ',';
            const signName = (signerInfo && signerInfo.nama_bendahara) ? signerInfo.nama_bendahara : '( ............................................................ )';
            const signNip = (signerInfo && signerInfo.nip_bendahara) ? ('NIP. ' + signerInfo.nip_bendahara) : 'NIP. .........................................................';
            dataList.forEach((data, index) => {
                if (index > 0 && index % 2 === 0) root.innerHTML += '<div class="page-break"></div>';
                
                const p = data.rincian_penghasilan || {};
                const s = data.rincian_potongan_simgaji || {};
                const kotor = Number(data.penghasilan_kotor) || 0;
                const simgaji = Number(data.potongan_simgaji) || 0;
                const gajiBersih = kotor - simgaji;
                const internal = Number(data.potongan_internal) || 0;
                const thp = Number(data.take_home_pay) || (gajiBersih - internal);

                let incomeRowsHtml = '';
                if (p.gapok) incomeRowsHtml += `<div class="row"><span>Gaji Pokok</span><span class="numeric">${formatRupiah(p.gapok)}</span></div>`;
                if (p.tjistri) incomeRowsHtml += `<div class="row"><span>Tj. Istri / Suami</span><span class="numeric">${formatRupiah(p.tjistri)}</span></div>`;
                if (p.tjanak) incomeRowsHtml += `<div class="row"><span>Tj. Anak</span><span class="numeric">${formatRupiah(p.tjanak)}</span></div>`;
                if (p.tjberas) incomeRowsHtml += `<div class="row"><span>Tj. Beras</span><span class="numeric">${formatRupiah(p.tjberas)}</span></div>`;
                if (p.tjaskes) incomeRowsHtml += `<div class="row"><span>Tj. Askes / Lainnya</span><span class="numeric">${formatRupiah(p.tjaskes)}</span></div>`;

                let resmiRowsHtml = '';
                if (s.iwp_beban_pegawai) resmiRowsHtml += `<div class="row"><span>IWP Pegawai</span><span class="numeric">${formatRupiah(s.iwp_beban_pegawai)}</span></div>`;
                if (s.iwp_taspen) resmiRowsHtml += `<div class="row"><span>IWP Taspen</span><span class="numeric">${formatRupiah(s.iwp_taspen)}</span></div>`;
                if (s.pph) resmiRowsHtml += `<div class="row"><span>PPh 21</span><span class="numeric">${formatRupiah(s.pph)}</span></div>`;
                if (s.jkk_jkm) resmiRowsHtml += `<div class="row"><span>JKK & JKM</span><span class="numeric">${formatRupiah(s.jkk_jkm)}</span></div>`;

                let internalHtml = (data.rincian_potongan_internal || []).map(i => `
                    <div class="row"><span>${i.pos_nama} ${i.cicilan_info ? '('+i.cicilan_info+')' : ''}</span><span class="numeric">${formatRupiah(i.nominal)}</span></div>
                `).join('');
                if (!internalHtml) {
                    internalHtml = `<div class="row"><span>Tidak ada potongan</span><span class="numeric">0</span></div>`;
                }

                root.innerHTML += `
                    <div class="slip-container">
                        <div class="header">
                            <div class="opd-title">${data.opd.toUpperCase()}</div>
                            <div class="meta-list">
                                <span>Periode</span><span>:</span><span>${period}</span>
                                <span>NIP</span><span>:</span><span>${data.nip}</span>
                                <span>Nama</span><span>:</span><span>${data.nama}</span>
                                <span>Pangkat/Gol</span><span>:</span><span>${data.kdpangkat || data.pangkat || '-'}</span>
                                <span>No. Rekening</span><span>:</span><span>${data.norek || '-'}</span>
                            </div>
                        </div>
                        <div class="slip-grid">
                            <div class="col">
                                <div class="col-title">Penghasilan</div>
                                ${incomeRowsHtml}
                                <div class="row total"><span>Penghasilan Kotor</span><span class="numeric">${formatRupiah(kotor)}</span></div>
                                <div class="row"><span>Potongan SIMGAJI</span><span class="numeric">${formatRupiah(simgaji)}</span></div>
                                <div class="row total"><span>Gaji Bersih</span><span class="numeric">${formatRupiah(gajiBersih)}</span></div>
                            </div>
                            <div class="col">
                                <div class="col-title">Potongan Resmi</div>
                                ${resmiRowsHtml}
                                <div class="row total"><span>Total Resmi</span><span class="numeric">${formatRupiah(simgaji)}</span></div>
                            </div>
                            <div class="col">
                                <div class="col-title">Potongan Lainnya</div>
                                ${internalHtml}
                                <div class="row total"><span>Total Potongan</span><span class="numeric">${formatRupiah(internal)}</span></div>
                            </div>
                        </div>
                        <div class="footer">
                            <span>DITERIMA BERSIH (THP): ${formatRupiah(thp)}</span>
                        </div>
                        <div class="sign-block">
                            <div class="sign-box">
                                <div>${signTitle}</div>
                                <div class="sign-space"></div>
                                <div class="sign-name">${signName}</div>
                                <div class="sign-nip">${signNip}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
